; The Python type gate. It checks what has an annotation and asks for none where there is none.
;
; A `bool` written down is what lets `check_conventions` decide `a-boolean-name-is-a-question` for Python. It reads the
; type off a definition, the way it already reads one off a C declaration.
;
; `mypy_path` is how a module of this tree finds its neighbour. The modules are not a package. `generator/normalize.py`
; says `import gate`, and mypy needs the three directories to resolve that.
;
; `disallow_untyped_defs` holds a module to having an annotation on each definition. It is on, and every module of
; this tree has them. A module arriving in the tree is held from the day it lands. Naming the modules that DO have
; them would leave a new one unheld.

[mypy]
mypy_path = generator:scripts:.claude/hooks
disallow_untyped_defs = True
; A section naming a module the tree does not hold is reported.
warn_unused_configs = True
; A module of this tree is run as a script rather than imported as a package member. Two of them share a basename with
; nothing, and the flag stops mypy asking for `__init__.py` files this tree does not want.
explicit_package_bases = False
namespace_packages = False

; Conan ships no annotations and no `py.typed` marker. It is somebody else's package, and `conanfile.py` names its
; classes rather than reasoning about them.
[mypy-conan.*]
ignore_missing_imports = True

; The recipe is Conan's shape rather than this project's. Its methods are named by Conan and take what Conan hands
; them, from a package that has no annotations. This one does not drain.
[mypy-conanfile]
disallow_untyped_defs = False
