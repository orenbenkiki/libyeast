# The "test" sub-gate runs the C parser tests across compilers and OSes. The tests are pure C. `CMakeLists.txt` builds
# the tests from `tests/test_*.c`. `.github/workflows/gh-pages.yml` runs the coverage gate `gh-pages-coverage` through
# the `gh-pages` target of `Makefile`.

name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unix:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest, cc: clang }
    steps:
      - uses: actions/checkout@v4
      - name: Update apt index
        if: runner.os == 'Linux'
        run: sudo apt-get update
      - name: Install dependencies
        run: make install-deps
      - name: C tests
        run: make test CC=${{ matrix.cc }}

  # A Windows job runs the tests under MSVC. The `Makefile` needs a Unix shell. The Windows job drives CMake directly.
  windows:
    name: windows-latest / msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Set up the MSVC toolchain, as https://github.com/ilammy/msvc-dev-cmd describes.
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cmake -S . -B build
      # `CMakeLists.txt` builds the MSVC Debug config under AddressSanitizer. The Release build is a plain smoke build.
      - run: cmake --build build --config Debug
      - run: ctest --test-dir build -C Debug --output-on-failure
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
