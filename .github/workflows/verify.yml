# The "verify" sub-gate. The `verify` target of the `Makefile` runs the verify gates its prerequisites name. The job needs no
# matrix.

name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update apt index
        run: sudo apt-get update
      - name: Install dependencies
        run: make install-deps-verify
      - name: Verify
        run: make verify
