# CodeQL analyzes the C code of the library for security faults. The `vet-lint` target of the `Makefile` runs clang-tidy and cppcheck over the library and the tests.

name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # not-prose: The literal is a cron schedule.

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake
      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
      - name: Build (library only)
        run: cmake -S . -B build -DYEAST_BUILD_TESTS=OFF && cmake --build build
      - uses: github/codeql-action/analyze@v3
